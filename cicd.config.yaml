app:
  name: my-app
  language: python
  port: 8080
  health_path: /health
  test_command: ''
cloud:
  provider: aws
  aws:
    region: us-east-1
    account_id: '123456789012'
    auth_method: oidc
kubernetes:
  cluster_type: eks
  staging:
    namespace: staging
    replicas: 1
    cpu_request: 100m
    cpu_limit: 500m
    memory_request: 256Mi
    memory_limit: 1Gi
  production:
    namespace: production
    replicas: 4
    cpu_request: 500m
    cpu_limit: 2000m
    memory_request: 1Gi
    memory_limit: 4Gi
    canary:
      enabled: true
      steps:
      - 10
      - 30
      - 60
      - 100
      pause_duration: 5m
      traffic_router: nginx
gitops:
  repo: YOUR_ORG/YOUR_GITOPS_REPO
  branch: main
argocd:
  staging_auto_sync: true
  production_auto_sync: false
evals:
  enabled: true
  judge_model: claude-sonnet-4-6
  thresholds:
    prompt_regression: 0.9
    tool_call_validation: 0.95
    rag_retrieval: 0.85
    hallucination_max: 0.05
    safety: 0.98
    latency_p95_ms: 15000
    latency_p99_ms: 30000
    avg_tokens: 2000
notifications:
  slack_webhook: false
  github_issues_on_rollback: true
