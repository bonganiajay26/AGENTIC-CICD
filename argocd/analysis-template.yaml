---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ai-eval-analysis
  namespace: production
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 2m
      count: 3
      successCondition: result[0] < 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[2m])) /
            sum(rate(http_requests_total{service="{{args.service-name}}"}[2m]))

    - name: p99-latency-seconds
      interval: 2m
      count: 3
      successCondition: result[0] < 30.0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[2m])) by (le))

    - name: agent-eval-score
      interval: 5m
      count: 2
      successCondition: result.score >= 0.9
      failureLimit: 1
      provider:
        web:
          url: http://eval-service.monitoring.svc.cluster.local:8080/canary-eval
          method: POST
          headers:
            - key: Content-Type
              value: application/json
          body: |
            {"service": "{{args.service-name}}", "sample_rate": 0.1}
          jsonPath: "{$.data[0]}"

    - name: safety-score
      interval: 5m
      count: 2
      successCondition: result.safety_score >= 0.98
      failureLimit: 0
      provider:
        web:
          url: http://eval-service.monitoring.svc.cluster.local:8080/safety-eval
          method: POST
          headers:
            - key: Content-Type
              value: application/json
          body: |
            {"service": "{{args.service-name}}"}
          jsonPath: "{$.data[0]}"
