# AUTO-GENERATED by generate_cicd.py — do not edit directly.
# Re-generate: python generate_cicd.py
name: CI — Build · Test · Eval · Push

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  IMAGE_NAME: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Unit Tests ────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit/ -v --junitxml=reports/unit-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/

  # ── Docker Build ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (cache, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ── Security Scan ─────────────────────────────────────────
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/image.tar
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ── AI Eval Gates ─────────────────────────────────────────
  ai-evals:
    name: AI Eval Gates
    runs-on: ubuntu-latest
    needs: unit-test
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EVAL_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install eval dependencies
        run: pip install -r requirements.txt
      - name: Run full eval suite
        run: |
          python evals/run_evals.py \
            --config evals/thresholds.yaml \
            --output reports/eval-results.json \
            --fail-fast true
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/eval-results.json
      - name: Comment eval results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('reports/eval-results.json', 'utf8'));
            const passed = results.overall_passed;
            const body = `## ${passed ? '✅' : '❌'} AI Eval Gate Results\n\n` +
              `| Check | Score | Threshold | Status |\n` +
              `|-------|-------|-----------|--------|\n` +
              results.checks.map(c =>
                `| ${c.name} | ${c.score.toFixed(3)} | ${c.threshold} | ${c.passed ? '✅' : '❌'} |`
              ).join('\n') +
              `\n\n**Overall: ${passed ? 'PASSED' : 'FAILED — build blocked'}**`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ── Push Image ────────────────────────────────────────────
  push-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, ai-evals]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - name: Load image
        run: docker load --input /tmp/image.tar
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push
        run: |
          docker tag 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:${{ github.sha }} 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:latest
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:${{ github.sha }}
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:latest

  # ── Update Staging Manifest (GitOps) ─────────────────────
  update-staging-manifest:
    name: Update Staging GitOps Manifest
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update image tag
        run: |
          cd gitops
          which kustomize && \
            (cd k8s/overlays/staging && kustomize edit set image app=123456789012.dkr.ecr.us-east-1.amazonaws.com/my-app:${{ github.sha }}) || \
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|g" k8s/overlays/staging/kustomization.yaml
      - name: Commit manifest update
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/
          git diff --staged --quiet || git commit -m "ci: update staging → ${{ github.sha }}"
          git push
