# AUTO-GENERATED by generate_cicd.py
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-app-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: my-app.availability
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{app="my-app",status=~"5.."}[5m])) /
            sum(rate(http_requests_total{app="my-app"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on my-app"
            description: "Error rate > 5% for 2 minutes."

        - alert: HighP99Latency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{app="my-app"}[5m])) by (le)) > 30
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High P99 latency on my-app"
            description: "P99 latency > 30s for 2 minutes."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"production|staging",
              pod=~"my-app.*"
            }[15m]) * 60 * 5 > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "my-app pod is crash-looping"

        - alert: AgentEvalScoreDegraded
          expr: |
            agent_eval_score{app="my-app"} < 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Agent eval score below threshold"
            description: "Eval score has been below 0.9 for 10 minutes."

        - alert: SafetyScoreDegraded
          expr: |
            agent_safety_score{app="my-app"} < 0.98
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Safety score below threshold — immediate attention required"
